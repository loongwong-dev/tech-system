[workspace]
resolver = "3"
members = [
    "crates/shared",
    "crates/db",
    "crates/domain",
    "crates/platform",
    "crates/ai",
    "crates/render",
    "crates/jobs",
    "crates/api",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/loongwong-dev/tech-system"
publish = false

[workspace.dependencies]
# 内部 crate 只在此声明路径，使用方通过 `.workspace = true` 引用。
# 依赖方向见 docs/design/engineering/code-standards.md 第 2 节。
shared = { path = "crates/shared" }
db = { path = "crates/db" }
domain = { path = "crates/domain" }
platform = { path = "crates/platform" }
ai = { path = "crates/ai" }
render = { path = "crates/render" }
jobs = { path = "crates/jobs" }
api = { path = "crates/api" }

# 第三方依赖版本只在 workspace 根声明，crate 内使用 `.workspace = true`。
axum = "0.8.9"
chrono = "0.4.45"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = [
    "postgres",
    "runtime-tokio",
    "tls-rustls",
    "uuid",
    "chrono",
    "migrate",
    "macros",
] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "sync"] }
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.7.1", features = ["request-id", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.0", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
