version: '1.0'
name: quality-gate
displayName: 质量门禁
triggers:
  trigger: auto
  push:
    branches:
      include:
        - main
        - master
  pr:
    branches:
      include:
        - main
        - master
stages:
  - name: quality
    displayName: 文档与规范
    strategy: naturally
    trigger: auto
    steps:
      - step: build@gcc
        name: repository_checks
        displayName: 语言无关检查
        gccVersion: 10.3
        commands:
          - bash scripts/check.sh all
strategy:
  blocking: true
permissions:
  - role: admin
    members: []
