name: 改进建议
description: 提议新的规则、检查项、文档结构或平台支持
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请说明建议解决的具体问题，以及为什么现有规范或检查不足。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前哪里不可执行、不可检查或容易误解？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 尽量给出规则文本、检查命令或目录结构。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 是否考虑过更轻量或零依赖的做法？
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      multiple: true
      options:
        - AGENTS.md 行为规则
        - 文档规范
        - CI / 检查脚本
        - Issue / PR 模板
        - 其他
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: 约束确认
      options:
        - label: 方案保持语言/框架无关
          required: false
        - label: 方案可通过脚本或 CI 检查
          required: false
        - label: 愿意提交 PR 实现
          required: false
