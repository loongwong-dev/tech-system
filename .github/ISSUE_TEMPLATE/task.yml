name: 开发任务
description: 一个可在一次会话内完成的原子任务，必须有可执行的验收标准
title: "[Feature] "
labels: ["kind:task", "status:ready"]
body:
  - type: markdown
    attributes:
      value: |
        任务应在一次会话内完成。做不完就拆成多个任务，不要延长单个任务的寿命。
        流程见 `docs/process/issue-workflow.md`，评审标准见 `docs/process/code-review.md`。
  - type: textarea
    id: goal
    attributes:
      label: 目标
      description: 一句话，动词开头。说明完成后会发生什么变化。
      placeholder: 教师可以在课次页批量生成 15 份反馈并查看进度
    validations:
      required: true
  - type: textarea
    id: spec
    attributes:
      label: 依据文档
      description: 指向 docs/ 中的具体章节。文档即规格，Issue 是它的任务切片。
      placeholder: docs/design/platform/api-contract.md 第 7 节
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 必须是可执行的命令、断言或可观察结果。不接受「功能正常」。
      placeholder: |
        1. `POST /api/v1/lessons/{id}/generations` 返回 jobId
        2. 教师离开页面后任务继续执行
        3. 15 份在 60 秒内完成
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 范围与非范围
      description: 明确不做什么，防止顺手扩大。
      value: |
        范围：
        - 待填写

        非范围：
        - 待填写
    validations:
      required: true
  - type: dropdown
    id: areas
    attributes:
      label: 涉及模块
      multiple: true
      options:
        - db
        - api
        - ai
        - render
        - jobs
        - web
        - admin
        - ops
        - docs
    validations:
      required: true
  - type: input
    id: depends
    attributes:
      label: 依赖
      description: 被哪个 Issue 阻塞，没有就留空。
      placeholder: "#12"
    validations:
      required: false
  - type: textarea
    id: tests
    attributes:
      label: 测试要求
      description: 哪些用例必须写。参考 docs/design/engineering/testing.md 的优先级清单。
      placeholder: 跨租户访问返回 404；配额扣减并发不超发
    validations:
      required: true
  - type: textarea
    id: dod
    attributes:
      label: 完成定义
      description: 交付时逐条确认，任一未满足不得进入评审。
      value: |
        - [ ] 验收标准逐条有证据（命令或可观察结果）
        - [ ] 失败路径与边界有测试
        - [ ] 受影响文档已同步
        - [ ] 行为变化已记入 CHANGELOG，取舍已记入 ADR
        - [ ] 无调试代码、临时代码或未引用文件
        - [ ] 可回滚，回滚方式已说明
    validations:
      required: true
  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 验收标准可以逐条执行，不依赖主观判断
          required: true
        - label: 范围与非范围已写明
          required: true
        - label: 已搜索现有 Issue，确认不是重复任务
          required: true
